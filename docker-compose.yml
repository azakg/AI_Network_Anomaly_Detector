version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: anomaly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anomalydb
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: python:3.11-slim
    container_name: anomaly_app
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
